services:
  # Default single-container deployment (SQLite, runs jobs in-process).
  # Use this for local / hobbyist / single-machine setups:
  #
  #   docker compose up
  #
  mapo:
    build: .
    init: true
    restart: "no"
    shm_size: 800m
    volumes:
      - ./data:/app/data:z
      - ./mapo.yaml:/app/mapo.yaml:ro,z
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------
  # Distributed mode (opt-in): Postgres queue + scaled workers.
  #
  #   docker compose --profile distributed up --scale worker=4
  #
  # The `mapo-web` service receives jobs and writes them to Postgres as
  # `pending`. The `worker` service polls the queue with FOR UPDATE SKIP
  # LOCKED so each job runs on exactly one worker, no matter how many you
  # scale to.
  # ----------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    profiles: ["distributed"]
    environment:
      POSTGRES_DB: mapo
      POSTGRES_USER: mapo
      POSTGRES_PASSWORD: mapo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapo"]
      interval: 5s
      timeout: 3s
      retries: 10

  mapo-web:
    build: .
    profiles: ["distributed"]
    init: true
    shm_size: 800m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MAPO_DB_URL: "postgresql://mapo:mapo@postgres:5432/mapo"
      MAPO_MODE: "web"
    volumes:
      - ./data:/app/data:z
      - ./mapo.yaml:/app/mapo.yaml:ro,z
    ports:
      - "8000:8000"
    env_file:
      - .env

  worker:
    build: .
    profiles: ["distributed"]
    init: true
    shm_size: 800m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MAPO_DB_URL: "postgresql://mapo:mapo@postgres:5432/mapo"
    volumes:
      - ./data:/app/data:z
      - ./mapo.yaml:/app/mapo.yaml:ro,z
    env_file:
      - .env
    command: ["python", "run.py", "worker"]

volumes:
  pgdata:
